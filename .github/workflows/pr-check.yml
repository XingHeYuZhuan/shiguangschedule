name: PR Checks

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify deterministic bundled school index
        run: |
          node tools/offline-repo/build-school-index.mjs
          git diff --exit-code -- shared/assets/offline_repo/index/school_index.pb

      - name: Run JavaScript regression tests
        run: |
          node tools/webview-request-interceptor-test/test-cross-origin.mjs
          node tools/seu-adapter-test/test-parser.mjs

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android host tests and build Debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --stacktrace
