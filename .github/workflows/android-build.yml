name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    environment: Release-Signing

    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 合并内置与远程教务资源 (Merge Bundled and Remote Resources)
        run: |
          REPO_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/XingHeYuZhuan/shiguang_warehouse.git"
          LOCAL_INDEX="shared/assets/offline_repo/index/school_index.pb"
          BUILTIN_INDEX="shared/assets/offline_repo/index/builtin_school_index.pb"
          LOCAL_RESOURCES="shared/assets/offline_repo/schools/resources"
          TEMP_ROOT=$(mktemp -d)
          trap 'rm -rf "$TEMP_ROOT"' EXIT

          if [ ! -f "$LOCAL_INDEX" ]; then
            echo "错误：仓库内置索引不存在：$LOCAL_INDEX"
            exit 1
          fi
          cp "$LOCAL_INDEX" "$BUILTIN_INDEX"

          mkdir -p "$TEMP_ROOT/local-resources"
          if [ -d "$LOCAL_RESOURCES" ]; then
            cp -a "$LOCAL_RESOURCES/." "$TEMP_ROOT/local-resources/"
          fi

          git clone --depth 1 --branch index-pb-release "$REPO_URL" "$TEMP_ROOT/index"
          if [ ! -f "$TEMP_ROOT/index/school_index.pb" ]; then
            echo "错误：index-pb-release 分支中没有 school_index.pb"
            exit 1
          fi
          cp "$TEMP_ROOT/index/school_index.pb" "$LOCAL_INDEX"

          git clone --depth 1 --filter=blob:none --sparse --branch main "$REPO_URL" "$TEMP_ROOT/warehouse"
          git -C "$TEMP_ROOT/warehouse" sparse-checkout set resources
          if [ ! -d "$TEMP_ROOT/warehouse/resources" ]; then
            echo "错误：shiguang_warehouse main 分支中没有 resources 目录"
            exit 1
          fi

          mkdir -p "$LOCAL_RESOURCES"
          cp -a "$TEMP_ROOT/warehouse/resources/." "$LOCAL_RESOURCES/"
          cp -a "$TEMP_ROOT/local-resources/." "$LOCAL_RESOURCES/"

          find "$LOCAL_RESOURCES" -name "adapters.yaml" -exec rm -f {} \;
          echo "内置适配器与远程适配仓库已合并。"

      - name: 运行贡献者数据生成脚本 (Generate Contributors Data)
        run: |
          echo "--- 正在赋予脚本执行权限 ---"
          # 确保脚本路径正确，并赋予执行权限
          chmod +x .github/scripts/build_contributors.sh

          echo "--- 正在执行贡献者数据生成 ---"
          # 运行脚本
          .github/scripts/build_contributors.sh    

      - name: 设置 JDK 21 (Setup JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 缓存 (Cache Gradle Dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 解码并准备签名密钥文件 (Decode and Prepare Signing Key)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/release.jks

      - name: 运行 Release 构建任务 (Build Release APK)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/androidApp/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --stacktrace

      - name: 上传构建产物到仓库 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 7
